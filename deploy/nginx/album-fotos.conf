# Copiar a: /etc/nginx/sites-available/album-fotos
# Enlazar: sudo ln -s /etc/nginx/sites-available/album-fotos /etc/nginx/sites-enabled/
# Probar:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;

    # Certbot agregará el bloque SSL después de: sudo certbot --nginx -d tu-dominio.com

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        client_max_body_size 105M;
    }

    location / {
        root /var/www/album-fotos/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
